<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unwrap Roulette · All coupons</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Chewy&family=Cinzel:wght@700&family=Comic+Neue:wght@700&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=IBM+Plex+Mono:wght@600&family=Playfair+Display:wght@700;900&family=Righteous&family=Rubik+Mono+One&family=Shrikhand&family=Space+Grotesk:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#1b1a1f; --ink:#f4ece6; --mute:#9c958f; }
    *{ box-sizing:border-box; }
    body{ margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 'Courier Prime', monospace; }
    header{ padding:28px 20px 8px; max-width:1400px; margin:0 auto; display:flex; flex-wrap:wrap; gap:12px 24px; align-items:end; justify-content:space-between; }
    h1{ margin:0; font:700 32px/1 'Pixelify Sans', sans-serif; letter-spacing:2px; }
    .ctl{ display:flex; gap:6px; }
    .ctl button{ font:700 13px 'Pixelify Sans', sans-serif; letter-spacing:1px; border:0; border-radius:10px; padding:10px 14px; background:#111; color:#F03B2C; cursor:pointer; }
    .ctl button.on{ background:#F03B2C; color:#111; }
    main{ max-width:1400px; margin:0 auto; padding:16px 20px 60px; display:grid; gap:22px; grid-template-columns:repeat(auto-fill, minmax(var(--min, 300px), 1fr)); }
    figure{ margin:0; }
    canvas{ width:100%; height:auto; display:block; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
    figcaption{ margin-top:8px; color:var(--mute); font-size:12px; display:flex; justify-content:space-between; gap:8px; }
    figcaption b{ color:var(--ink); font-weight:700; }
  </style>
</head>
<body>
  <header>
    <div><h1>ALL COUPONS</h1><div id="count" style="color:var(--mute)"></div></div>
    <div class="ctl"><button data-a="1.4" class="on">Wide</button><button data-a="0.64">Tall</button></div>
  </header>
  <main id="grid"></main>
  <script src="vouchers.js"></script>
  <script src="cards.js"></script>
  <script>
    const grid=document.getElementById('grid'); let aspect=1.4;
    const imgs={}; const load=id=>imgs[id]||(imgs[id]=new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src='assets/packshots/'+id+'.png'; }));
    async function draw(){
      grid.innerHTML=''; grid.style.setProperty('--min', aspect>1 ? '340px' : '240px');
      document.getElementById('count').textContent=VOUCHERS.length+' coupons';
      for(const [i,v] of VOUCHERS.entries()){
        const fig=document.createElement('figure'); grid.appendChild(fig);
        await loadCardFonts(v.tpl); const img=await load(v.id);
        const c=drawVoucherCard(v,img,aspect); fig.appendChild(c);
        const cap=document.createElement('figcaption'); cap.innerHTML=`<span><b>${i+1}. ${v.text.replace(/</g,'&lt;')}</b></span><span>${v.tpl}</span>`; fig.appendChild(cap);
      }
    }
    document.querySelectorAll('.ctl button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.ctl button').forEach(x=>x.classList.toggle('on',x===b)); aspect=+b.dataset.a; draw(); });
    document.fonts.ready.then(draw);
  </script>
</body>
</html>
