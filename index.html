<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#E7B9A3" id="theme-color" />
  <title>Unwrap Roulette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Chewy&family=Cinzel:wght@700&family=Comic+Neue:wght@700&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=IBM+Plex+Mono:wght@600&family=Playfair+Display:wght@700;900&family=Righteous&family=Rubik+Mono+One&family=Shrikhand&family=Space+Grotesk:wght@700&family=VT323&display=swap" rel="stylesheet">
  <script src="vouchers.js"></script>
  <script src="cards.js"></script>
  <style>
    :root{ --cover:#F03B2C; --bg:#2D4A3E; }
    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; overflow:hidden; background:var(--bg); transition:background .6s ease; }
    #stage{ position:fixed; inset:0; }
    #gl{ position:fixed; left:0; top:0; width:100vw; height:100vh; height:100lvh; display:block; touch-action:none; cursor:grab; }   /* full bleed: under Safari's glass bars too */
    #gl.grabbing{ cursor:grabbing; }
    
    /* Intro */
    .intro{ position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center; padding:0 16px max(28px, env(safe-area-inset-bottom)); transition:opacity .5s ease; pointer-events:none; }
    .intro .intro-inner{ pointer-events:auto; }
    .intro.hidden, .intro.hidden .intro-inner{ opacity:0; pointer-events:none; visibility:hidden; transition:opacity .5s ease, visibility 0s .5s; }
    .intro-inner{ background:var(--gift-deep, #B31313); color:var(--gift-deep-ink, #000); transition:background .6s ease, color .6s ease; width:min(400px, 100%); padding:20px 22px; border-radius:14px;
      box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.06); text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
      transform:translateY(10px) scale(.98); opacity:0; transition:opacity .45s cubic-bezier(.2,.8,.2,1), transform .45s cubic-bezier(.2,.8,.2,1); }
    .intro.show .intro-inner{ opacity:1; transform:none; }
    .intro-title{ font-family:'Pixelify Sans',sans-serif; font-weight:700; letter-spacing:2px; font-size:clamp(30px, 5vw, 42px); line-height:.82; }
    .intro-btn{ background:#111; color:var(--accent, #F03B2C); border:none; padding:12px 22px; border-radius:8px; font-family:'Pixelify Sans',sans-serif; font-weight:700; letter-spacing:1px; font-size:15px; cursor:pointer; transition:transform .1s ease, background .2s ease, color .2s ease; }
    .intro-btn:hover{ background:#FFD700; color:#000; }
    .intro-btn:active{ transform:translateY(1px) scale(.99); }
    .intro-note{ margin:0; color:inherit; opacity:.85; font:12px/1.45 'Courier Prime', monospace; }

    /* Toolbar */
    .bar{ position:absolute; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); transform:translateX(-50%);
      display:flex; align-items:center; gap:4px; padding:5px; border-radius:14px;
      background:rgba(18,12,10,.58); backdrop-filter:blur(14px) saturate(1.3); -webkit-backdrop-filter:blur(14px) saturate(1.3);
      box-shadow:0 10px 30px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.08); transition:opacity .3s ease, transform .3s ease; }
    .bar.off{ opacity:0; pointer-events:none; transform:translate(-50%, 12px); }
    .bar button, .bar select{ font:600 13px/1 'Pixelify Sans', system-ui, sans-serif; letter-spacing:.5px; color:#f4ece6; background:transparent; border:0; height:36px; padding:0 12px; border-radius:9px; cursor:pointer; white-space:nowrap; transition:background .15s ease, color .15s ease; }
    .bar button:hover, .bar select:hover{ background:rgba(255,255,255,.1); }
    .bar button.on{ background:#f4ece6; color:#141010; }
    .bar select{ appearance:none; -webkit-appearance:none; padding-right:26px; max-width:160px;
      background-image:linear-gradient(45deg, transparent 50%, #f4ece6 50%), linear-gradient(135deg, #f4ece6 50%, transparent 50%);
      background-position:calc(100% - 14px) 16px, calc(100% - 9px) 16px; background-size:5px 5px; background-repeat:no-repeat; }
    .bar select option{ color:#111; }
    .sep{ width:1px; height:20px; background:rgba(255,255,255,.14); margin:0 2px; }
    .bar #new.pulse{ animation:pulse 1.4s ease-in-out infinite; }
    @keyframes pulse{ 0%,100%{ background:rgba(255,215,0,0);} 50%{ background:rgba(255,215,0,.35);} }
    /* Actions: Next on the left (after ripping), Share always on the right, sound at the top */
    .actions{ position:absolute; inset:0; pointer-events:none; transition:opacity .35s ease; }
    .actions.off{ opacity:0; }
    .actions.off *{ pointer-events:none !important; }
    .next, .share, .prev{ position:absolute; bottom:max(18px, env(safe-area-inset-bottom)); height:40px; padding:0 16px; border:0; border-radius:11px; cursor:pointer; pointer-events:auto;
      font:700 14px/1 'Pixelify Sans', system-ui, sans-serif; letter-spacing:1px; box-shadow:0 10px 24px rgba(0,0,0,.28); transition:opacity .35s ease, transform .35s cubic-bezier(.2,.9,.25,1.2), background .15s ease; }
    .next, .share{ color:var(--accent, #F03B2C); background:#111; transition:opacity .35s ease, transform .35s cubic-bezier(.2,.9,.25,1.2), background .15s ease, color .6s ease; }
    .next:hover, .share:hover, .prev:hover{ background:#000; filter:brightness(1.12); }
    /* discreet previous: a small square left of Next, only once there's somewhere to go back to */
    .prev{ width:40px; padding:0; color:var(--accent, #F03B2C); background:rgba(17,17,17,.55); box-shadow:none; opacity:0; pointer-events:none; transition:opacity .3s ease, background .15s ease, color .6s ease; }
    .prev.show{ opacity:1; pointer-events:auto; }
    .next{ right:max(16px, env(safe-area-inset-right)); }
    .share{ left:max(16px, env(safe-area-inset-left)); }
    /* once there's something to see, Next gift wiggles to say "go on" */
    .next.show{ animation:nudge 2.4s ease-in-out .3s infinite; }
    @keyframes nudge{ 0%,62%,100%{ transform:none; } 66%{ transform:rotate(-5deg) scale(1.04); } 70%{ transform:rotate(5deg) scale(1.04); } 74%{ transform:rotate(-4deg); } 78%{ transform:rotate(3deg); } 82%{ transform:none; } }
    .next:active, .share:active{ transform:translateY(1px) scale(.98); }
    .snd-top{ position:absolute; top:max(16px, env(safe-area-inset-top)); right:max(16px, env(safe-area-inset-right)); width:44px; height:44px; border-radius:12px; border:0; cursor:pointer; pointer-events:auto;
      font:700 17px/1 'Pixelify Sans', system-ui, sans-serif; color:var(--accent, #F03B2C); background:#111; box-shadow:0 8px 20px rgba(0,0,0,.25); transition:background .15s ease, color .6s ease; }
    .snd-top:hover{ background:#000; }
    .snd-top.on{ opacity:.55; }   /* muted: same colour, dimmed */
    .hint{ position:absolute; left:50%; top:max(18px, env(safe-area-inset-top)); transform:translateX(-50%); font:13px/1.3 'Courier Prime', monospace; color:#fff; background:rgba(18,12,10,.45); padding:8px 14px; border-radius:20px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:opacity .6s ease; pointer-events:none; max-width:calc(100vw - 32px); text-align:center; white-space:normal; }
    .hint.gone{ opacity:0; }
    .bar #send{ background:#F03B2C; color:#fff; }
    .bar #send:hover{ background:#ff5446; }
    .bar #send.pulse{ animation:pulse2 1.4s ease-in-out infinite; }
    @keyframes pulse2{ 0%,100%{ box-shadow:0 0 0 0 rgba(240,59,44,.0);} 50%{ box-shadow:0 0 0 6px rgba(240,59,44,.45);} }
    .sheet{ position:absolute; inset:0; display:grid; place-items:center; background:rgba(10,6,4,.35); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity .25s ease; }
    .sheet.open{ opacity:1; pointer-events:auto; }
    .sheet-card{ position:relative; width:min(340px, calc(100vw - 32px)); background:var(--gift, #B31313); border-radius:14px; padding:22px 20px 20px; box-shadow:0 24px 60px rgba(0,0,0,.45); font-family:'Courier Prime', monospace; color:var(--gift-ink, #000); transform:translateY(8px) rotate(-1deg); transition:transform .25s ease; }
    .sheet.open .sheet-card{ transform:none; }
    .sheet-card h3{ margin:0 44px 6px 0; font:700 26px/1 'Pixelify Sans', sans-serif; letter-spacing:1px; }
    .sheet-card p{ margin:0 0 14px; font-size:13px; opacity:.85; }
    .sheet-card label{ display:block; font-size:12px; font-weight:700; margin:10px 0 4px; letter-spacing:1px; }
    .sheet-card input{ width:100%; font:16px 'Courier Prime', monospace; color:#000; padding:10px 12px; border:2px solid #000; border-radius:8px; background:#fff2ee; outline:none; }
    .sheet-card input:focus{ border-color:#000; background:#fff; }
    .sheet-close{ position:absolute; top:14px; right:14px; width:36px; height:36px; border:0; border-radius:10px; background:#111; color:var(--accent, #F03B2C); font:700 18px/1 'Pixelify Sans', sans-serif; cursor:pointer; }
    .sheet-close:hover{ background:#000; }
    .sheet-row{ display:flex; margin-top:16px; }
    .sheet-row button{ flex:1; font:700 15px 'Pixelify Sans', sans-serif; letter-spacing:1px; border:0; border-radius:10px; padding:14px; cursor:pointer; }
    .sheet-row .go{ background:#111; color:var(--accent, #F03B2C); } .sheet-row .go:hover{ background:#000; }
    .sheet-done{ margin-top:12px; font-size:13px; min-height:1.2em; color:inherit; font-weight:700; word-break:break-all; }
    .intro-from{ font:700 13px/1.4 'Courier Prime', monospace; color:#111; margin:0; }
    .nogl{ position:absolute; inset:0; display:grid; place-items:center; color:#fff; font:16px 'Courier Prime', monospace; text-align:center; padding:24px; }
    @media (max-width:560px){
      .bar span.l{ display:none; }
      .bar #send span.l{ display:inline; }
      .bar button, .bar select{ padding:0 10px; }
      .bar select{ max-width:118px; }
      .hint{ font-size:12px; }
    }

<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div class="hint gone" id="hint">Grab the paper and keep dragging to rip it off</div>
  <select id="pattern" hidden aria-hidden="true"></select>
  <div class="actions off" id="bar">
    <button class="prev" id="prev" title="Previous gift" aria-label="Previous gift">←</button>
    <button class="next" id="next" title="Next gift (R)">Next gift →</button>
    <button class="share" id="send" title="Share this gift with someone">Share</button>
    <button class="snd-top" id="snd" title="Sound (M)" aria-label="Sound">♪</button>
  </div>
  <div id="sheet" class="sheet" aria-hidden="true">
    <form class="sheet-card" id="sheet-form" autocomplete="off">
      <button type="button" class="sheet-close" id="sheet-cancel" aria-label="Close">✕</button>
      <h3>SEND THIS GIFT</h3>
      <p>They get this exact box. What's inside stays a surprise (sorry).</p>
      <label for="to">TO</label><input id="to" maxlength="24" placeholder="Their name">
      <label for="from">FROM</label><input id="from" maxlength="24" placeholder="Your name">
      <div class="sheet-row"><button type="submit" class="go">GET LINK</button></div>
      <div class="sheet-done" id="sheet-done"></div>
    </form>
  </div>
  <div id="intro" class="intro">
    <div class="intro-inner">
      <div class="intro-from" id="intro-from" hidden></div>
      <div class="intro-title">UNWRAP<br>ROULETTE</div>
      <button id="start-btn" class="intro-btn">START</button>
      <div class="intro-note" id="intro-note">The gift? Who cares.<br>The unwrap? That’s the fun part.<br><strong>Grab, drag, rip. Repeat.</strong></div>
    </div>
  </div>
</div>

<script>
'use strict';
// =====================================================================
//  Unwrap Roulette v2 — WebGL2 cloth over a gift box
//  Verlet cloth (structural + shear + bend), tearing, frayed edges,
//  satin/velvet/cotton shading, shadow map, procedural rip audio.
// =====================================================================

const $ = s => document.querySelector(s);
const canvas = $('#gl');
const gl = canvas.getContext('webgl2', { antialias:true, alpha:false, preserveDrawingBuffer:false, powerPreference:'high-performance' });
if(!gl){
  $('#stage').insertAdjacentHTML('beforeend','<div class="nogl">This needs WebGL2.<br>Try a recent Chrome, Safari or Firefox.</div>');
  throw new Error('WebGL2 unavailable');
}
const ANISO = gl.getExtension('EXT_texture_filter_anisotropic');
gl.vertexAttrib1f(3, 1.0);   // static meshes are fully intact

// ---------------------------------------------------------------- presents
const PRESENTS = window.VOUCHERS;   // fake brands, card templates and packshots live in vouchers.js / cards.js

// ---------------------------------------------------------------- utils
const clamp = (x,a,b)=> x<a?a:(x>b?b:x);
const lerp = (a,b,t)=> a+(b-a)*t;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hash2(i,j){ let n=(Math.imul(i,374761393)+Math.imul(j,668265263))|0; n=Math.imul(n^(n>>>13),1274126177); return ((n^(n>>>16))>>>0)/4294967296; }
function vnoise(x,y){ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi; const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return lerp(lerp(hash2(xi,yi),hash2(xi+1,yi),u), lerp(hash2(xi,yi+1),hash2(xi+1,yi+1),u), v); }
function fbm(x,y){ let s=0,a=.5,f=1; for(let i=0;i<4;i++){ s+=a*vnoise(x*f+i*17.3,y*f-i*9.1); f*=2.03; a*=.5; } return s; }
function hexLin(hex){ const h=hex.replace('#',''); return [0,2,4].map(i=>Math.pow(parseInt(h.substr(i,2),16)/255,2.2)); }
function shade(hex, amt){ // amt -1..1 lighten/darken in sRGB
  const h=hex.replace('#',''); const c=[0,2,4].map(i=>parseInt(h.substr(i,2),16));
  const o=c.map(v=> Math.round(amt>=0 ? v+(255-v)*amt : v*(1+amt)));
  return '#'+o.map(v=>('0'+clamp(v,0,255).toString(16)).slice(-2)).join('');
}

// mat4 (column-major)
const M4 = {
  persp(fovy,a,n,f){ const t=1/Math.tan(fovy/2), nf=1/(n-f); return new Float32Array([t/a,0,0,0, 0,t,0,0, 0,0,(f+n)*nf,-1, 0,0,2*f*n*nf,0]); },
  ortho(l,r,b,t,n,f){ const lr=1/(l-r), bt=1/(b-t), nf=1/(n-f); return new Float32Array([-2*lr,0,0,0, 0,-2*bt,0,0, 0,0,2*nf,0, (l+r)*lr,(t+b)*bt,(f+n)*nf,1]); },
  lookAt(e,c,up){
    let zx=e[0]-c[0], zy=e[1]-c[1], zz=e[2]-c[2]; let l=Math.hypot(zx,zy,zz); zx/=l; zy/=l; zz/=l;
    let xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx; l=Math.hypot(xx,xy,xz); xx/=l; xy/=l; xz/=l;
    const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
    return new Float32Array([xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0, -(xx*e[0]+xy*e[1]+xz*e[2]), -(yx*e[0]+yy*e[1]+yz*e[2]), -(zx*e[0]+zy*e[1]+zz*e[2]), 1]);
  },
  mul(a,b){ const o=new Float32Array(16); for(let c=0;c<4;c++) for(let r=0;r<4;r++){ o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3]; } return o; },
  inv(m){
    const a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7],a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];
    const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,
          b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
    let d=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06; d=1/d;
    return new Float32Array([
      (a11*b11-a12*b10+a13*b09)*d,(a02*b10-a01*b11-a03*b09)*d,(a31*b05-a32*b04+a33*b03)*d,(a22*b04-a21*b05-a23*b03)*d,
      (a12*b08-a10*b11-a13*b07)*d,(a00*b11-a02*b08+a03*b07)*d,(a32*b02-a30*b05-a33*b01)*d,(a20*b05-a22*b02+a23*b01)*d,
      (a10*b10-a11*b08+a13*b06)*d,(a01*b08-a00*b10-a03*b06)*d,(a30*b04-a31*b02+a33*b00)*d,(a21*b02-a20*b04-a23*b00)*d,
      (a11*b07-a10*b09-a12*b06)*d,(a00*b09-a01*b07+a02*b06)*d,(a31*b01-a30*b03-a32*b00)*d,(a20*b03-a21*b01+a22*b00)*d]);
  },
  xf(m,x,y,z){ const w=m[3]*x+m[7]*y+m[11]*z+m[15]; return [(m[0]*x+m[4]*y+m[8]*z+m[12])/w,(m[1]*x+m[5]*y+m[9]*z+m[13])/w,(m[2]*x+m[6]*y+m[10]*z+m[14])/w]; }
};

// ---------------------------------------------------------------- patterns (tileable 1024² canvases)
const TS = 1024;
function makeTile(bg, fn){ const c=document.createElement('canvas'); c.width=c.height=TS; const g=c.getContext('2d'); g.fillStyle=bg; g.fillRect(0,0,TS,TS); fn(g,TS); return c; }
function wrapped(g,S,fn){ for(const ox of [-S,0,S]) for(const oy of [-S,0,S]){ g.save(); g.translate(ox,oy); fn(); g.restore(); } }
function star(g,x,y,r,rot,pts=5,inner=.45){ g.beginPath(); for(let i=0;i<pts*2;i++){ const a=rot+i*Math.PI/pts, rr=i%2?r*inner:r; g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); } g.closePath(); g.fill(); }
function printGrain(g,S,seed,alpha=.05){ const R=mulberry32(seed); for(let i=0;i<9000;i++){ g.fillStyle=R()<.5?`rgba(255,255,255,${alpha*R()})`:`rgba(0,0,0,${alpha*R()})`; g.fillRect(R()*S,R()*S,1+R()*2,1+R()*2); } }

const PATTERNS = [
  { id:'candy', name:'Candy Stripe', bg:'#2C4A3C', ribbon:'#1F6B45', mat:{sheen:0, velvet:0, exp:60, threads:0, smooth:.62, coat:.75, fiber:.12, glitter:0, holo:0, bump:.8, keys:[['#C9A227',1,.86,1],['#C8102E',0,.6,.15]]},
    draw(){ return makeTile('#F3EBDD',(g,S)=>{ const P=S/5;
      for(let k=-2;k<12;k++){ const x=k*P; g.fillStyle='#C8102E'; g.beginPath(); g.moveTo(x,0); g.lineTo(x+P*.42,0); g.lineTo(x+P*.42-S,S); g.lineTo(x-S,S); g.closePath(); g.fill();
        g.fillStyle='#C9A227'; const o=P*.62; g.beginPath(); g.moveTo(x+o,0); g.lineTo(x+o+P*.05,0); g.lineTo(x+o+P*.05-S,S); g.lineTo(x+o-S,S); g.closePath(); g.fill(); }
      printGrain(g,S,1); }); } },
  { id:'dots', name:'Midnight Dots', bg:'#E7B9A3', ribbon:'#D62828', mat:{sheen:.12, velvet:.75, exp:40, threads:200, smooth:.1, coat:0, fiber:0, glitter:0, holo:0, bump:1.2, keys:[['#F2E8CF',.35,.72,1]]},
    draw(){ return makeTile('#14213D',(g,S)=>{ const P=S/8; g.fillStyle='#F2E8CF';

// ---------------------------------------------------------------- paper material maps
// Each print is keyed by its inks: foil inks are metallic, some inks are glossy or matte against the paper, and
// raised inks (foil stamping, puff print, screen print) get an embossed edge. Packed as R metal, G smoothness,
// BA tangent-space normal, at 512² (built from the same 1024² print, so the edges line up).
const MS = 512;
function materialMap(p, tile){
  const m=p.mat, c=document.createElement('canvas'); c.width=c.height=MS; const g=c.getContext('2d'); g.drawImage(tile,0,0,MS,MS);
  const px=g.getImageData(0,0,MS,MS).data, N=MS*MS, met=new Float32Array(N), smo=new Float32Array(N).fill(m.smooth||0), hgt=new Float32Array(N);
  const keys=(m.keys||[]).map(([hex,mt,sm,h])=>({ c:[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)), mt, sm, h }));
  if(keys.length) for(let i=0;i<N;i++){ const r=px[i*4], gg=px[i*4+1], b=px[i*4+2]; let bw=0, bk=null;
    for(const k of keys){ const d=Math.hypot(r-k.c[0], gg-k.c[1], b-k.c[2]); const w=1-clamp((d-16)/44,0,1); if(w>bw){ bw=w; bk=k; } }
    if(bk){ const w=bw*bw*(3-2*bw); met[i]=bk.mt*w; smo[i]+= (bk.sm-smo[i])*w; hgt[i]=bk.h*w; } }
  // soften the height into a bevel (wrapping box blur, twice), then take its slope as the emboss normal
  const tmp=new Float32Array(N), R=3, blur=(a,b,dx)=>{ for(let y=0;y<MS;y++) for(let x=0;x<MS;x++){ let s=0; for(let k=-R;k<=R;k++){ const xx=dx?(x+k+MS)%MS:x, yy=dx?y:(y+k+MS)%MS; s+=a[yy*MS+xx]; } b[y*MS+x]=s/(2*R+1); } };
  blur(hgt,tmp,1); blur(tmp,hgt,0); blur(hgt,tmp,1); blur(tmp,hgt,0);
  const out=new Uint8Array(N*4), K=MS*0.012;
  for(let y=0;y<MS;y++) for(let x=0;x<MS;x++){ const i=y*MS+x;
    const hx=(hgt[y*MS+(x+1)%MS]-hgt[y*MS+(x-1+MS)%MS])*K, hy=(hgt[((y+1)%MS)*MS+x]-hgt[((y-1+MS)%MS)*MS+x])*K;
    out[i*4]=met[i]*255; out[i*4+1]=clamp(smo[i],0,1)*255; out[i*4+2]=clamp(128-hx*127,0,255); out[i*4+3]=clamp(128+hy*127,0,255); }
  return out;
}

  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR); gl.generateMipmap(gl.TEXTURE_2D); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  if(ANISO) gl.texParameterf(gl.TEXTURE_2D, ANISO.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, gl.getParameter(ANISO.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));

  const later=fn=> window.requestIdleCallback ? requestIdleCallback(fn,{timeout:1500}) : setTimeout(fn,150);
  const go=()=>{ const p=todo.shift(); if(p && !patCache[p.id]) patternTex(p); if(todo.length) setTimeout(()=>later(go), 120); };
  setTimeout(()=>later(go), 300); }

const VS = `#version 300 es

uniform mat4 uVP; uniform mat4 uModel; out vec3 vPos; out vec3 vNor; out vec2 vUV; out float vKeep;
void main(){ vec4 w=uModel*vec4(aPos,1.0); vPos=w.xyz; vNor=mat3(uModel)*aNor; vUV=aUV; vKeep=aKeep; gl_Position=uVP*w; }`;

uniform sampler2DShadow uShadow; uniform mat4 uLightVP; uniform float uTexel; uniform vec3 uLightDir; uniform vec3 uEye;
out vec4 outColor;

  float s=0.0; float r=hash12(gl_FragCoord.xy)*6.2831; mat2 rot=mat2(cos(r),-sin(r),sin(r),cos(r));

const FABRIC_FS = COMMON + `

uniform sampler2D uPat; uniform sampler2D uMat; uniform vec2 uLid; uniform float uTile; uniform vec3 uRibbon; uniform float uRibW; uniform vec3 uBg;
uniform float uSheen, uVelvet, uExp, uThreads;
uniform float uCoat, uFiber, uLinen, uGlitter, uHolo, uBump;
// A small photo studio, seen in reflections: a big softbox where the key light is, a tall strip light on the right,
// a cool fill on the left, white ceiling, and the coloured table below. Glossy and foil papers mirror it, so it
// slides across them as the camera or the paper moves.
vec3 studio(vec3 R, float rough){
  float w = rough*rough;
  vec3 c = mix(mix(uBg, vec3(dot(uBg,vec3(0.3,0.59,0.11))), 0.5)*0.4 + 0.01, vec3(0.16,0.17,0.19), smoothstep(-0.35-w, 0.25+w, R.z));

const FOV = 28*Math.PI/180, TILT = 0.30;
